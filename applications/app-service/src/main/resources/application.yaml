server:
  port: 8080
spring:
  application:
    name: "ms_jd_credy_ya"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  r2dbc:
    host: "localhost"
    port: 5432
    database: "ms_jd_credy_ya"
    username: "postgres"
    password: "Admin"
    pool:
      initial-size: 10
      max-size: 30
      max-idle-time: 30m
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    org.springframework.data.r2dbc: DEBUG
    io.r2dbc.postgresql.QUERY: INFO

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
